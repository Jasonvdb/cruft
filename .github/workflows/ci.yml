name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: swift test --package-path CruftKit
      - name: Chokepoint invariant
        run: ./Scripts/check-chokepoint.sh
      - name: App target (compile only)
        # CODE_SIGNING_ALLOWED=NO — compile-only; ad-hoc signing is local-only.
        run: xcodebuild -project Cruft.xcodeproj -scheme Cruft -configuration Debug build CODE_SIGNING_ALLOWED=NO
